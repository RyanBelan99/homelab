{{- $app := .Values.apps.dispatcharr }}
{{- define "dispatcharr.backendEnv" -}}
- name: POSTGRES_HOST
  value: localhost
- name: POSTGRES_PORT
  value: "5432"
- name: POSTGRES_DB
  value: dispatcharr
- name: POSTGRES_USER
  value: dispatch
- name: POSTGRES_PASSWORD
  valueFrom:
    secretKeyRef:
      name: dispatcharr-db
      key: POSTGRES_PASSWORD
- name: REDIS_HOST
  value: localhost
- name: REDIS_PORT
  value: "6379"
{{- end }}
{{- define "dispatcharr.baseEnv" -}}
{{ include "homelab.tz" . }}
- name: PUID
  value: {{ .Values.admin.uid | quote }}
- name: PGID
  value: {{ .Values.admin.gid | quote }}
- name: DISPATCHARR_ENV
  value: modular
{{- end }}
# Live TV for Jellyfin: web, celery, PostgreSQL and Redis in one pod over localhost.
# Separate official Redis because the all-in-one image's jemalloc fails on 16 KiB pages.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr
  namespace: {{ $app.namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dispatcharr
  template:
    metadata:
      labels:
        app: dispatcharr
    spec:
      {{- include "homelab.nodeSelector" (list . $app.node) | nindent 6 }}
      containers:
        - name: web
          image: {{ $app.image }}
          env:
            {{- include "dispatcharr.baseEnv" . | nindent 12 }}
            - name: DISPATCHARR_LOG_LEVEL
              value: info
            {{- include "dispatcharr.backendEnv" . | nindent 12 }}
          ports:
            - name: web
              containerPort: 9191
          # First start runs migrations.
          startupProbe:
            tcpSocket:
              port: 9191
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 9191
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 9191
            periodSeconds: 60
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: celery
          image: {{ $app.image }}
          command: ["/app/docker/entrypoint.celery.sh"]
          env:
            {{- include "dispatcharr.baseEnv" . | nindent 12 }}
            - name: DISPATCHARR_PORT
              value: "9191"
            - name: DISPATCHARR_LOG_LEVEL
              value: info
            {{- include "dispatcharr.backendEnv" . | nindent 12 }}
            - name: DJANGO_SETTINGS_MODULE
              value: dispatcharr.settings
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: db
          image: {{ $app.postgresImage }}
          args: ["-c", "listen_addresses=localhost"]
          securityContext:
            {{- include "homelab.runAsAdmin" . | nindent 12 }}
          env:
            - name: POSTGRES_DB
              value: dispatcharr
            - name: POSTGRES_USER
              value: dispatch
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dispatch", "-d", "dispatcharr"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: postgres
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
        - name: redis
          image: {{ $app.redisImage }}
          securityContext:
            {{- include "homelab.runAsAdmin" . | nindent 12 }}
          # Cache and task queue only: nothing persisted.
          command: ["redis-server", "--bind", "127.0.0.1", "--timeout", "300", "--save", "", "--appendonly", "no"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        {{- include "homelab.configVolume" (list . "data" "dispatcharr/data") | nindent 8 }}
        {{- include "homelab.configVolume" (list . "postgres" "dispatcharr/postgres") | nindent 8 }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcharr
  namespace: {{ $app.namespace }}
spec:
  selector:
    app: dispatcharr
  ports:
    - name: web
      port: 9191
      targetPort: 9191
