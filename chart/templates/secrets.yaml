{{- $s := required "pass secrets.yaml with -f" .Values.secrets }}
{{- $a := .Values.apps }}
apiVersion: v1
kind: Secret
metadata:
  name: pihole-secrets
  namespace: {{ $a.pihole.namespace }}
type: Opaque
stringData:
  FTLCONF_webserver_api_password: {{ $s.piholePassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: vpn-credentials-sabnzbd
  namespace: {{ $a.sabnzbd.namespace }}
type: Opaque
stringData:
  {{- toYaml (required "secrets.vpn.sabnzbd: a ProtonVPN WireGuard config of its own" $s.vpn.sabnzbd) | nindent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: vpn-credentials-prowlarr
  namespace: {{ $a.prowlarr.namespace }}
type: Opaque
stringData:
  {{- toYaml $s.vpn.prowlarr | nindent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: vpn-credentials-proton-exit
  namespace: {{ $a.protonExit.namespace }}
type: Opaque
stringData:
  {{- toYaml $s.vpn.protonExit | nindent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth-proton-exit
  namespace: {{ $a.protonExit.namespace }}
type: Opaque
stringData:
  TS_AUTHKEY: {{ $s.tailscale.protonExitAuthKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: {{ $a.tailscaleOperator.namespace }}
type: Opaque
stringData:
  client_id: {{ $s.tailscale.operatorClientId | quote }}
  client_secret: {{ $s.tailscale.operatorClientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dispatcharr-db
  namespace: {{ $a.dispatcharr.namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $s.dispatcharr.dbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dispatcharr-api
  namespace: {{ $a.livetvPlaylists.namespace }}
type: Opaque
stringData:
  DISPATCHARR_API_KEY: {{ $s.dispatcharr.apiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: homepage-widgets
  namespace: {{ $a.homepage.namespace }}
type: Opaque
stringData:
  {{- range $k, $v := $s.homepage }}
  HOMEPAGE_VAR_{{ $k }}: {{ $v | quote }}
  {{- end }}
  HOMEPAGE_VAR_TAILNET: {{ $s.tailnet | quote }}
  {{- /* The CrowdSec widget's machine password: generated once and kept. Register it in LAPI with
  the command in docs/host-config.md (CrowdSec section). */}}
  {{- $widgets := (lookup "v1" "Secret" $a.homepage.namespace "homepage-widgets").data | default dict }}
  HOMEPAGE_VAR_CROWDSEC_PASSWORD: {{ (get $widgets "HOMEPAGE_VAR_CROWDSEC_PASSWORD" | b64dec) | default (randAlphaNum 32) | quote }}
