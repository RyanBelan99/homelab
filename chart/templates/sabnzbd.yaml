{{- $app := .Values.apps.sabnzbd }}
{{- $n := .Values.network }}
# Usenet downloads. Its traffic to the provider leaves through its own ProtonVPN tunnel;
# Radarr and Sonarr reach it in-cluster, Traefik on the tailnet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: {{ $app.namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      {{- include "homelab.nodeSelector" (list . $app.node) | nindent 6 }}
      # DNS through gluetun, inside the tunnel.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      initContainers:
        {{- include "homelab.gluetun" (dict "root" . "image" $app.gluetunImage "secret" "vpn-credentials-sabnzbd" "env" (list
          (dict "name" "FIREWALL_INPUT_PORTS" "value" "8080")
          (dict "name" "FIREWALL_OUTBOUND_SUBNETS" "value" (printf "%s,%s,%s" $n.lanCIDR $n.podCIDR $n.serviceCIDR))
          (dict "name" "DNS_UPSTREAM_RESOLVERS" "value" "cloudflare,quad9")
        )) | nindent 8 }}
      containers:
        - name: sabnzbd
          image: {{ $app.image }}
          env:
            {{- include "homelab.linuxserverEnv" . | nindent 12 }}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            # Article cache plus par2 repair and unpacking.
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        {{- include "homelab.configVolume" (list . "config" "sabnzbd") | nindent 8 }}
        - name: data
          hostPath:
            path: {{ .Values.paths.data }}
            type: Directory
        {{- include "homelab.tunVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  namespace: {{ $app.namespace }}
spec:
  selector:
    app: sabnzbd
  ports:
    - name: web
      port: 8080
      targetPort: 8080
