{{- $app := .Values.apps.pihole }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: unbound-dot
  namespace: {{ $app.namespace }}
data:
  # DNS-over-TLS only: no plaintext fallback.
  unbound.conf: |
    server:
        verbosity: 1
        interface: 127.0.0.1
        port: 5053
        do-ip4: yes
        do-ip6: no
        do-udp: yes
        do-tcp: yes
        access-control: 127.0.0.0/8 allow
        hide-identity: yes
        hide-version: yes
        prefetch: yes
        num-threads: 1
        tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
    forward-zone:
        name: "."
        forward-tls-upstream: yes
        forward-addr: 1.1.1.1@853#cloudflare-dns.com
        forward-addr: 1.0.0.1@853#cloudflare-dns.com
        forward-addr: 9.9.9.9@853#dns.quad9.net
        forward-addr: 149.112.112.112@853#dns.quad9.net
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-etc
  namespace: {{ $app.namespace }}
  {{- include "homelab.keepAnnotation" . | nindent 2 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: {{ $app.namespace }}
  labels:
    app: pihole
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
        - name: pihole
          image: {{ $app.image }}
          envFrom:
            - secretRef:
                name: pihole-secrets
          env:
            {{- include "homelab.tz" . | nindent 12 }}
            - name: FTLCONF_dns_listeningMode
              value: all
            # Set here, not in the web UI: env wins on every restart.
            - name: FTLCONF_dns_upstreams
              value: 127.0.0.1#5053
            - name: FTLCONF_misc_dnsmasq_lines
              value: address=/{{ .Values.network.localDomain }}/{{ .Values.nodes.server.ip }}
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: pihole-etc
              mountPath: /etc/pihole
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
        - name: unbound
          image: {{ $app.unboundImage }}
          command: ["unbound", "-d", "-c", "/etc/unbound/unbound.conf"]
          volumeMounts:
            - name: unbound-conf
              mountPath: /etc/unbound/unbound.conf
              subPath: unbound.conf
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
      volumes:
        - name: pihole-etc
          persistentVolumeClaim:
            claimName: pihole-etc
        - name: unbound-conf
          configMap:
            name: unbound-dot
---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: {{ $app.namespace }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: pihole
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: {{ $app.namespace }}
spec:
  selector:
    app: pihole
  ports:
    - name: http
      port: 80
      targetPort: http
