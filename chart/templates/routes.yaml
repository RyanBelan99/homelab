{{/* One Traefik route per app with a route: <host>.<tailnet> via its Tailscale Service, plus
<host>.<localDomain> on the LAN unless route.lan is false. The LAN path has no Tailscale policy,
so admin apps turn it off and stay reachable only through the tailnet. */}}
{{- range $name, $app := .Values.apps }}
{{- with $app.route }}
{{- $lan := true }}
{{- if hasKey . "lan" }}{{ $lan = .lan }}{{ end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $name }}
  namespace: {{ $app.namespace }}
spec:
  entryPoints: [web]
  routes:
    - match: '{{ if $lan }}Host(`{{ .host }}.{{ $.Values.network.localDomain }}`) || {{ end }}HostRegexp(`^{{ .host }}\..+\.ts\.net$`)'
      kind: Rule
      services:
        - name: {{ .service }}
          port: {{ .port }}
{{- end }}
{{- end }}
