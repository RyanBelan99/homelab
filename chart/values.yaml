# Central config for the cluster. Secrets live in
# ../secrets/secrets.yaml (gitignored, see ../secrets.example.yaml).

timezone: America/Los_Angeles

# Host account that owns the app data on the nodes.
admin:
  user: rbelan
  uid: 1000
  gid: 1000

network:
  lanCIDR: 192.168.0.0/24
  podCIDR: 10.42.0.0/16
  podGateway: 10.42.0.1
  # The server's pod range, where Traefik runs (kubectl get node <server> -o jsonpath='{.spec.podCIDR}').
  # Apps that trust Traefik's sign-in headers trust this range.
  serverPodCIDR: 10.42.0.0/24
  serviceCIDR: 10.43.0.0/16
  localDomain: home.arpa

# server: k3s control plane, ServiceLB, front door. worker: heavy apps.
nodes:
  server:
    name: centralpi
    ip: 192.168.0.34
  worker:
    name: centralbook

paths:
  config: /mnt/config
  data: /mnt/data

# Folders on a node's own disk, each a node-bound volume (storage.yaml): a pod can only run on
# the node that holds its data, and never starts on another node with an empty folder.
# <base> is a key of paths; app picks the namespace and node.
storage:
  volumes:
    - {app: radarr, base: config, path: radarr}
    - {app: sonarr, base: config, path: sonarr}
    - {app: prowlarr, base: config, path: prowlarr}
    - {app: sabnzbd, base: config, path: sabnzbd}
    - {app: seerr, base: config, path: seerr}
    - {app: jellyfin, base: config, path: jellyfin/config}
    - {app: jellyfin, base: config, path: jellyfin/cache}
    - {app: dispatcharr, base: config, path: dispatcharr/data}
    - {app: dispatcharr, base: config, path: dispatcharr/postgres}
    - {app: livetvPlaylists, base: config, path: dispatcharr/data/m3us}
    - {app: keycloak, base: config, path: keycloak/postgres}
    - {app: protonExit, base: config, path: proton-exit}
    - {app: observability, base: config, path: observability/prometheus}
    - {app: observability, base: config, path: observability/grafana}
    # Media: shared by Radarr, Sonarr and SABnzbd (one claim, one node); Jellyfin reads media/.
    - {app: radarr, base: data, path: ""}
    - {app: jellyfin, base: data, path: media}

# Ingress allow lists per namespace (networkpolicies.yaml).
networkPolicies:
  enabled: true

# Public HTTPS on secrets.publicDomain (a free dynamic-DNS name). The router forwards TCP 443
# to the server; Pi-hole answers the name (and its sub-names) with the server's LAN IP at home.
# Apps opt in with public: {host, loginPath}: host "" is the bare name, otherwise <host>.<name>.
# One certificate covers every public name.
public:
  enabled: true
  # DNS host for the name: duckdns or desec (both lego and ddns-updater provider codes).
  provider: duckdns
  # le-staging until the first certificate works, then le (Let's Encrypt rate limits).
  certResolver: le
  ddnsUpdaterImage: qmcgaw/ddns-updater:v2.10.0

# Every app: where it runs, what it runs, and how it is reached.
#   route.host       <host>.<localDomain> on the LAN, <host>.<tailnet> as a Tailscale Service
#   route.lan        false = tailnet only (the LAN path skips the Tailscale policy); admin apps set it
#   dashboard        its Homepage tile (layout under dashboard: at the bottom)
apps:
  pihole:
    namespace: pihole
    node: server
    image: docker.io/pihole/pihole:latest@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    unboundImage: klutchell/unbound:latest@sha256:5020cfe1218aeda38777f88279220162e602c3a44efc684550dbf46137106a16
    route: {host: pihole, service: pihole-web, port: 80, lan: false}
    dashboard:
      title: Pi-hole
      sidecars: [unbound]
      icon: pi-hole.svg
      description: DNS + ad blocking
      path: /admin/
      widget:
        type: pihole
        version: 6
        url: http://pihole-web.pihole.svc.cluster.local
        keyVar: PIHOLE_KEY


  traefik:
    namespace: traefik
    node: server
    chartVersion: 41.7.1
    dashboard:
      title: Traefik
      icon: traefik.svg
      description: "Front door: LAN, tailnet and public HTTPS ({{ .Values.nodes.server.name }})"
      podSelector: app.kubernetes.io/name=traefik

  # Reads Traefik, Jellyfin and Seerr logs, bans attackers; Traefik's bouncer plugin blocks
  # them on the public routes. LAPI (the ban list) on the server, an agent on every node.
  crowdsec:
    namespace: crowdsec
    node: server
    chartVersion: 0.24.3
    bouncerPlugin: v1.8.2
    # kubectl with a shell, for the agent watchdog (crowdsec.yaml).
    watchdogImage: alpine/k8s:1.36.2
    collections: [crowdsecurity/traefik, LePresidente/jellyfin, LePresidente/jellyseerr]
    # Never ban: home LAN, pods, and the tailnet (Tailscale's 100.64.0.0/10).
    trusted: [192.168.0.0/24, 10.42.0.0/16, 100.64.0.0/10]
    # If the bouncer can't reach LAPI: -1 keeps serving with the last ban list it has
    # (fail open); N blocks every public request after N missed 60 s syncs (fail closed).
    updateMaxFailure: -1
    dashboard:
      title: CrowdSec
      icon: crowdsec.svg
      href: https://app.crowdsec.net
      description: "Ban list (LAPI) on {{ .Values.nodes.server.name }}, community blocklist"
      podSelector: k8s-app=crowdsec,type=lapi
      # Alerts and bans from the last 24 h, as the "homepage" machine (see docs/host-config.md).
      widget:
        type: crowdsec
        url: http://crowdsec-service.crowdsec.svc.cluster.local:8080
        username: homepage
        passwordVar: CROWDSEC_PASSWORD

  # Metrics, dashboards and alerts: Prometheus, Grafana and kube-state-metrics in one pod, plus
  # a node-exporter per node. Alerts go to Telegram from Grafana (secrets.telegram).
  observability:
    namespace: observability
    node: worker
    prometheusImage: prom/prometheus:v3.15.1
    grafanaImage: grafana/grafana:13.3.0
    nodeExporterImage: prom/node-exporter:v1.12.1
    kubeStateMetricsImage: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
    retention: 15d
    route: {host: grafana, service: grafana, port: 3000, lan: false}
    # Downloaded into Grafana at start, pinned; ${DS_PROMETHEUS} is pointed at the local Prometheus.
    dashboards:
      node-exporter-full: https://grafana.com/api/dashboards/1860/revisions/46/download
      traefik: https://grafana.com/api/dashboards/17346/revisions/9/download
      crowdsec-overview: https://raw.githubusercontent.com/crowdsecurity/grafana-dashboards/c89d8476b32ea76e924c488db7d0afd0306fc609/dashboards_v5/Crowdsec%20Overview.json
      crowdsec-lapi: https://raw.githubusercontent.com/crowdsecurity/grafana-dashboards/c89d8476b32ea76e924c488db7d0afd0306fc609/dashboards_v5/LAPI%20Metrics.json
      crowdsec-machines: https://raw.githubusercontent.com/crowdsecurity/grafana-dashboards/c89d8476b32ea76e924c488db7d0afd0306fc609/dashboards_v5/Crowdsec%20Details%20per%20Machine.json
    # Alert rules (Grafana alerting, to Telegram): the query returns the measured value and
    # op/value is the threshold. Summaries use Grafana's {{ $labels.x }} placeholders.
    alerts:
      - uid: node-down
        title: Node exporter down
        expr: up{job="node"}
        op: lt
        value: 1
        for: 3m
        summary: "{{ $labels.instance }} stopped reporting metrics"
      - uid: disk-low
        title: Disk space low
        expr: 100 * node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}
        op: lt
        value: 15
        for: 15m
        summary: "{{ $labels.instance }} {{ $labels.mountpoint }} has under 15% free"
      - uid: cert-expiry
        title: Certificate expires soon
        expr: (max by (cn) (traefik_tls_certs_not_after) - time()) / 86400
        op: lt
        value: 14
        for: 1h
        summary: "Certificate {{ $labels.cn }} expires in under 14 days: renewal is failing"
      - uid: pod-crashloop
        title: Pod restarting
        expr: increase(kube_pod_container_status_restarts_total[30m])
        op: gt
        value: 3
        for: 5m
        summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 30 minutes"
      - uid: deployment-down
        title: App not ready
        expr: kube_deployment_status_replicas_available
        op: lt
        value: 1
        for: 10m
        summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has no ready pod"
      - uid: on-battery
        title: Worker on battery
        expr: max by (instance) (node_power_supply_online{power_supply=~"(?i).*(ac|adp|mains|usb-c).*"})
        op: lt
        value: 1
        for: 2m
        summary: "{{ $labels.instance }} lost AC power; a drained MacBook stays off until its lid opens"
      - uid: too-hot
        title: Node running hot
        expr: max by (instance) (node_thermal_zone_temp)
        op: gt
        value: 75
        for: 10m
        summary: "{{ $labels.instance }} is above 75 C"
      - uid: crowdsec-agent-down
        title: CrowdSec agent down
        expr: up{job="crowdsec",pod=~"crowdsec-agent.*"}
        op: lt
        value: 1
        for: 15m
        summary: "CrowdSec agent {{ $labels.pod }} is down: that node's logs go unread"
    dashboard:
      title: Grafana
      icon: grafana.svg
      description: Metrics, dashboards and alerts
      sidecars: [prometheus, kube-state-metrics]
      podSelector: app=observability

  tailscaleOperator:
    namespace: tailscale
    node: server
    chartVersion: 1.104.4
    hostname: tailscale-operator
    dashboard:
      title: Tailscale operator
      icon: tailscale.svg
      href: https://login.tailscale.com/admin/machines
      description: kubectl through the tailnet
      podSelector: app=operator

  protonExit:
    namespace: vpn-exit
    node: server
    gluetunImage: qmcgaw/gluetun:v3.41.3
    tailscaleImage: tailscale/tailscale:v1.104.2
    hostname: proton-exit
    tag: tag:exit-proton
    dashboard:
      appLabel: proton-exit
      title: proton-exit
      icon: proton-vpn.svg
      description: Tailscale exit node via ProtonVPN
      sidecars: [gluetun]
      podSelector: app=proton-exit

  jellyfin:
    namespace: media
    node: worker
    image: jellyfin/jellyfin:latest
    route: {host: jellyfin, service: jellyfin, port: 8096}
    # Live TV guide artwork (per programme, about 1 GB a day) older than this is deleted nightly.
    livetvArtworkDays: 3
    # Public HTTPS at secrets.publicDomain (see public: above); loginPath gets a stricter rate limit.
    public: {host: "", loginPath: "(?i)^/Users/AuthenticateByName$"}
    dashboard:
      title: Jellyfin
      icon: jellyfin.svg
      description: Media server
      widget:
        type: jellyfin
        url: http://jellyfin.media.svc.cluster.local:8096
        keyVar: JELLYFIN_KEY
        version: 2
        fields: [movies, series, episodes]
        enableBlocks: true
        enableNowPlaying: true
        expandOneStreamToTwoRows: false

  seerr:
    namespace: media
    node: worker
    image: ghcr.io/seerr-team/seerr:v3.5.1
    route: {host: seerr, service: seerr, port: 5055}
    # Public at seerr.<publicDomain>; sign-in is with Jellyfin accounts.
    public: {host: seerr, loginPath: "(?i)^/api/v1/auth/(jellyfin|local)$"}
    dashboard:
      title: Seerr
      icon: seerr.svg
      description: Request movies and shows

  dispatcharr:
    namespace: media
    node: worker
    image: ghcr.io/dispatcharr/dispatcharr@sha256:96bc548978c68e684677da7895692eeeefb7f0b2edfa38311dac2b702c61d236
    postgresImage: postgres:17.11-trixie
    redisImage: redis:8.8.4-trixie
    route: {host: dispatcharr, service: dispatcharr, port: 9191, lan: false}
    dashboard:
      title: Dispatcharr
      sidecars: [celery, postgres, redis]
      icon: dispatcharr.png
      description: Live TV channels for Jellyfin

  livetvPlaylists:
    namespace: media
    node: worker
    image: python:3.13.9-alpine3.22
    schedule: "15 5 * * *"

  radarr:
    namespace: media
    node: worker
    image: lscr.io/linuxserver/radarr:latest
    clusterIP: 10.43.23.177
    route: {host: radarr, service: radarr, port: 7878, lan: false}
    dashboard:
      title: Radarr
      icon: radarr.svg
      description: Movies
      widget:
        type: radarr
        url: http://radarr.media.svc.cluster.local:7878
        keyVar: RADARR_KEY
        fields: [wanted, queued, movies]

  sonarr:
    namespace: media
    node: worker
    image: lscr.io/linuxserver/sonarr:latest
    clusterIP: 10.43.39.177
    route: {host: sonarr, service: sonarr, port: 8989, lan: false}
    dashboard:
      title: Sonarr
      icon: sonarr.svg
      description: TV
      widget:
        type: sonarr
        url: http://sonarr.media.svc.cluster.local:8989
        keyVar: SONARR_KEY

  prowlarr:
    namespace: media
    node: worker
    image: lscr.io/linuxserver/prowlarr:latest
    gluetunImage: qmcgaw/gluetun:latest
    route: {host: prowlarr, service: prowlarr, port: 9696, lan: false}
    dashboard:
      title: Prowlarr
      sidecars: [gluetun]
      icon: prowlarr.svg
      description: Indexers (via VPN)
      widget:
        type: prowlarr
        url: http://prowlarr.media.svc.cluster.local:9696
        keyVar: PROWLARR_KEY
        fields: [numberOfGrabs, numberOfQueries, numberOfFailGrabs]

  sabnzbd:
    namespace: media
    node: worker
    image: lscr.io/linuxserver/sabnzbd:latest
    gluetunImage: qmcgaw/gluetun:latest
    route: {host: sabnzbd, service: sabnzbd, port: 8080, lan: false}
    dashboard:
      title: SABnzbd
      sidecars: [gluetun]
      icon: sabnzbd.svg
      description: Usenet (via VPN)
      widget:
        type: sabnzbd
        url: http://sabnzbd.media.svc.cluster.local:8080
        keyVar: SABNZBD_KEY

  homepage:
    namespace: dashboard
    node: null
    image: ghcr.io/gethomepage/homepage:latest
    title: CentralPI
    route: {host: home, service: homepage, port: 3000, lan: false}

  # Sign-in (OIDC) for the admin apps. Tailnet only; never public.
  keycloak:
    namespace: auth
    node: worker
    image: quay.io/keycloak/keycloak:26.8.1
    postgresImage: postgres:18.7-alpine
    oauth2ProxyImage: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    # Session store for the shared oauth2-proxy (same official image Dispatcharr runs on 16 KiB pages).
    redisImage: redis:8.8.4-trixie
    route:
      host: auth
      service: keycloak
      port: 8080
      lan: false
      middlewares: [{name: forwarded-https, namespace: auth}]
    sso:
      # The one OIDC client the shared oauth2-proxy uses; sign-in completes on this app's
      # host, the redirect URI the client allows.
      client: homepage
      # OIDC clients in the homelab realm. Imported only when the realm is first
      # created; a client added here later must also be added in the console.
      clients: [homepage]
      # Apps behind Keycloak sign-in (one shared oauth2-proxy + forward auth, admins only).
      protect: [homepage, prowlarr, radarr, sonarr, sabnzbd, pihole, dispatcharr, observability]
    dashboard:
      title: Keycloak
      sidecars: [postgres]
      icon: keycloak.svg
      description: Sign-in for the admin apps
      podSelector: app=keycloak

# Homepage layout: groups and tile order. A tile is an app key above or an extra below.
dashboard:
  groups:
    - {name: Infrastructure, columns: 2, tiles: [pihole, ddnsUpdater]}
    - {name: Security, columns: 4, tiles: [keycloak, sso, crowdsec, crowdsecAgents]}
    - {name: Cluster, columns: 4, tiles: [observability, traefik, coredns, metricsServer, localPath, tailscaleOperator, protonExit, nodeExporter]}
    - {name: Media, columns: 3, tiles: [jellyfin, seerr, dispatcharr]}
    - {name: Automation, columns: 4, tiles: [radarr, sonarr, prowlarr, sabnzbd]}
  extras:
    nodeExporter:
      title: node-exporter
      icon: mdi-chip
      description: Disk, CPU, temperature and power, per node
      namespace: observability
      podSelector: app=node-exporter
    sso:
      title: Sign-in proxy
      icon: mdi-shield-key
      description: One oauth2-proxy for every admin app
      sidecars: [redis]
      namespace: auth
      podSelector: app=oauth2-proxy
    crowdsecAgents:
      title: CrowdSec agents
      icon: crowdsec.svg
      description: Read Traefik, Jellyfin and Seerr logs (one per node)
      namespace: crowdsec
      podSelector: k8s-app=crowdsec,type=agent
    ddnsUpdater:
      title: DuckDNS updater
      icon: mdi-web-sync
      href: https://www.duckdns.org
      description: Keeps the public name on the home IP
      namespace: traefik
      podSelector: app=ddns-updater
    localPath:
      title: local-path
      icon: mdi-harddisk
      description: Volumes for Pi-hole, Traefik and CrowdSec
      namespace: kube-system
      podSelector: app=local-path-provisioner
    coredns:
      title: CoreDNS
      icon: mdi-dns
      description: Cluster DNS (*.svc.cluster.local)
      namespace: kube-system
      podSelector: k8s-app=kube-dns
    metricsServer:
      title: metrics-server
      icon: mdi-chart-line
      description: Feeds the CPU and memory numbers
      namespace: kube-system
      podSelector: k8s-app=metrics-server
