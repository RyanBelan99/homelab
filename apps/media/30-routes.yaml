# One Traefik route per app, answering two names:
#   <app>.home.arpa         home network (Pi-hole points *.home.arpa at the node)
#   <app>.<tailnet>.ts.net  the app's Tailscale Service, if one is published
#                           (scripts/07-tailscale-services.sh; tailscale serve keeps
#                           the original Host header). Matched by pattern so the
#                           tailnet name never lands in this public repo.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  entryPoints: [web]
  routes:
    - match: 'Host(`jellyfin.home.arpa`) || HostRegexp(`^jellyfin\..+\.ts\.net$`)'
      kind: Rule
      services:
        - name: jellyfin
          port: 8096
