# One hostname per app, served by Traefik on port 80. Pi-hole resolves
# *.home.arpa to the node (apps/pihole/20-deployment.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
spec:
  rules:
    - host: jellyfin.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
