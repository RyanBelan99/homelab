apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: centralbook
      # All containers in the pod share gluetun's network. DNS goes to gluetun's
      # own resolver (127.0.0.1), which sends it through the VPN tunnel instead of
      # CoreDNS, so torrent lookups never leave the house unencrypted.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      initContainers:
        # Native sidecar (restartPolicy: Always): starts first, and qBittorrent only
        # starts once the startupProbe says the tunnel is up. Its firewall is the
        # kill switch: if the VPN drops, qBittorrent has no internet at all.
        - name: gluetun
          image: qmcgaw/gluetun:latest
          restartPolicy: Always
          # A restarted container keeps the pod's network namespace, including
          # the policy-routing rules of a run that died abruptly (probe kill,
          # power loss). gluetun then fails forever with "adding IPv6 rule:
          # file exists". Clear them before every start (the gluetun wiki's
          # Kubernetes fix, run before the entrypoint instead of racing it).
          command:
            - /bin/sh
            - -c
            - |
              while ip rule del table 51820 2>/dev/null; do :; done
              while ip -6 rule del table 51820 2>/dev/null; do :; done
              exec /gluetun-entrypoint
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          envFrom:
            - secretRef:
                name: vpn-credentials-qbittorrent
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: VPN_TYPE
              value: wireguard
            # Web UI must stay reachable from the LAN and from Radarr/Sonarr.
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            # Allow replies to the home LAN and the cluster's pod/service ranges.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "192.168.0.0/24,10.42.0.0/16,10.43.0.0/16"
            # Proton hands out a new forwarded port on every reconnect. Push it into
            # qBittorrent's listening port (and pin qBittorrent to tun0). This needs
            # qBittorrent's "Bypass authentication for clients on localhost", which only
            # covers the two containers in this pod.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'wget -q -O- --retry-connrefused --tries=30
                --post-data "json={\"listen_port\":{{PORTS}},\"current_network_interface\":\"tun0\"}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
          startupProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          hostPath:
            path: /mnt/config/qbittorrent
            type: Directory
        - name: data
          hostPath:
            path: /mnt/data
            type: Directory
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
# Only the web UI is published on the LAN. Peers reach qBittorrent through the
# VPN (and its port forwarding), so 6881 is no longer exposed on the Pi.
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
spec:
  # In-cluster only: browsers reach it through Traefik (30-ingress.yaml).
  selector:
    app: qbittorrent
  ports:
    - name: web
      port: 8080
      targetPort: 8080
