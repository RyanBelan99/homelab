apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: centralbook
      # Indexer searches and .torrent grabs leave through gluetun, like qBittorrent.
      # DNS goes to gluetun (encrypted, through the tunnel). gluetun can't resolve
      # cluster names, so Radarr and Sonarr are pinned in /etc/hosts; their Services
      # pin the same clusterIPs in 22-radarr.yaml and 23-sonarr.yaml.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      hostAliases:
        - ip: 10.43.23.177
          hostnames: ["radarr", "radarr.media.svc.cluster.local"]
        - ip: 10.43.39.177
          hostnames: ["sonarr", "sonarr.media.svc.cluster.local"]
      initContainers:
        # Native sidecar: starts first, Prowlarr waits for the tunnel. Separate
        # WireGuard config from qBittorrent's (one Proton device per tunnel).
        - name: gluetun
          image: qmcgaw/gluetun:latest
          restartPolicy: Always
          # A restarted container keeps the pod's network namespace, including
          # the policy-routing rules of a run that died abruptly (probe kill,
          # power loss). gluetun then fails forever with "adding IPv6 rule:
          # file exists". Clear them before every start (the gluetun wiki's
          # Kubernetes fix, run before the entrypoint instead of racing it).
          command:
            - /bin/sh
            - -c
            - |
              while ip rule del table 51820 2>/dev/null; do :; done
              while ip -6 rule del table 51820 2>/dev/null; do :; done
              exec /gluetun-entrypoint
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          envFrom:
            - secretRef:
                name: vpn-credentials-prowlarr
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: VPN_TYPE
              value: wireguard
            # Web UI from the LAN, and Radarr/Sonarr calling Prowlarr's API.
            - name: FIREWALL_INPUT_PORTS
              value: "9696"
            # Replies to the LAN, plus Prowlarr syncing indexers to Radarr/Sonarr.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "192.168.0.0/24,10.42.0.0/16,10.43.0.0/16"
            # Two encrypted DNS upstreams (DNS over TLS, inside the tunnel): with only
            # Cloudflare, a single slow lookup reached the apps as "Resource
            # temporarily unavailable" and failed an indexer search.
            - name: DNS_UPSTREAM_RESOLVERS
              value: "cloudflare,quad9"
          startupProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
          ports:
            - containerPort: 9696
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /config
        - name: flaresolverr
          image: ghcr.io/germondai/trawl:latest
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: TZ
              value: America/Los_Angeles
            - name: SESSION_CACHE_DRIVER
              value: memory

            # Single browser
            - name: BROWSER_POOL_SIZE
              value: "1"

            # Firefox resource constraints
            - name: BROWSER_MAX_CONTENT_PROCESSES
              value: "2"
            - name: BROWSER_HARDWARE_CONCURRENCY
              value: "4"
          ports:
            - containerPort: 8191
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          hostPath:
            path: /mnt/config/prowlarr
            type: Directory

        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice

        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
spec:
  # In-cluster only: browsers reach it through Traefik (30-routes.yaml).
  selector:
    app: prowlarr
  ports:
    - name: web
      port: 9696
      targetPort: 9696
    
