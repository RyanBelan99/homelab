# Dispatcharr: the Live TV manager behind Jellyfin's Live TV. It imports the
# free ad-supported channel lists that 28-livetv-playlists.yaml writes (Pluto TV,
# Samsung TV Plus), their guides from i.mjh.nz, and serves Jellyfin one channel
# list and one guide, in-cluster:
#   Tuner:  http://dispatcharr.media.svc.cluster.local:9191/output/m3u
#   Guide:  http://dispatcharr.media.svc.cluster.local:9191/output/epg
# A channel that both services carry (NFL Channel) is one Dispatcharr channel
# with a stream from each, Pluto first, so it fails over if one stops. The
# playlist job's sync step keeps that grouping up to date through the API.
# The web UI (admins only) is dispatcharr.home.arpa and svc:dispatcharr. The
# channel list, guide and streams answer only the pod network (the sync sets
# Dispatcharr's network access), so they return 403 through Traefik.
#
# Dispatcharr's "modular" layout, as one pod: web (UI, API, stream proxy),
# celery (background imports), PostgreSQL and Redis, talking over localhost.
# Not the all-in-one image: its bundled Redis uses a jemalloc built for 4 KiB
# memory pages and won't start on centralbook's 16 KiB-page Asahi kernel. The
# official redis image is built for that.
#
# State lives under /mnt/config/dispatcharr (hostPath, uid 1000):
#   data/      Dispatcharr's /data: settings, logos, logs, and the m3us/ folder
#              it watches for playlists
#   postgres/  the database
# Redis only holds caches and the task queue, so it keeps nothing on disk.
# The database password is the dispatcharr-db Secret in 10-secret.yaml.
#
# Lives on centralbook next to Jellyfin, its main client.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dispatcharr
  template:
    metadata:
      labels:
        app: dispatcharr
    spec:
      nodeSelector:
        kubernetes.io/hostname: centralbook
      containers:
        # No runAsUser on web and celery: the Dispatcharr image starts as root
        # to create its user (PUID/PGID), then runs everything under it.
        - name: web
          # 0.33.0 (2026-10-24), pinned by digest. web and celery must use the
          # same image. To upgrade, look up the new digest of :latest and read
          # the changelog for migrations.
          image: ghcr.io/dispatcharr/dispatcharr@sha256:96bc548978c68e684677da7895692eeeefb7f0b2edfa38311dac2b702c61d236
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DISPATCHARR_ENV
              value: modular
            - name: DISPATCHARR_LOG_LEVEL
              value: info
            - name: POSTGRES_HOST
              value: localhost
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: dispatcharr
            - name: POSTGRES_USER
              value: dispatch
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-db
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: localhost
            - name: REDIS_PORT
              value: "6379"
          ports:
            - name: web
              containerPort: 9191
          # The first start runs database migrations, so give it a while.
          startupProbe:
            tcpSocket:
              port: 9191
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 9191
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 9191
            periodSeconds: 60
          # One FFmpeg per channel being watched (copying, not transcoding).
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: celery
          image: ghcr.io/dispatcharr/dispatcharr@sha256:96bc548978c68e684677da7895692eeeefb7f0b2edfa38311dac2b702c61d236
          command: ["/app/docker/entrypoint.celery.sh"]
          # Same as web, plus what the upstream compose file gives celery.
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DISPATCHARR_ENV
              value: modular
            - name: DISPATCHARR_PORT
              value: "9191"
            - name: DISPATCHARR_LOG_LEVEL
              value: info
            - name: POSTGRES_HOST
              value: localhost
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: dispatcharr
            - name: POSTGRES_USER
              value: dispatch
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-db
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: localhost
            - name: REDIS_PORT
              value: "6379"
            - name: DJANGO_SETTINGS_MODULE
              value: dispatcharr.settings
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: db
          image: postgres:17.11-trixie
          # Only the containers in this pod use it, so listen on localhost alone.
          args: ["-c", "listen_addresses=localhost"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: POSTGRES_DB
              value: dispatcharr
            - name: POSTGRES_USER
              value: dispatch
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-db
                  key: POSTGRES_PASSWORD
            # A subfolder, so initdb gets an empty directory it owns.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dispatch", "-d", "dispatcharr"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: postgres
              mountPath: /var/lib/postgresql/data
            # PostgreSQL needs more shared memory than the container default.
            - name: shm
              mountPath: /dev/shm
        - name: redis
          image: redis:8.8.4-trixie
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          # Cache and task queue only: no snapshots or append-only file. Only the
          # containers in this pod use it, so listen on localhost alone.
          command: ["redis-server", "--bind", "127.0.0.1", "--timeout", "300", "--save", "", "--appendonly", "no"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          hostPath:
            path: /mnt/config/dispatcharr/data
            type: Directory
        - name: postgres
          hostPath:
            path: /mnt/config/dispatcharr/postgres
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcharr
  namespace: media
spec:
  # In-cluster only. Jellyfin reads the channel list, guide and streams here;
  # browsers reach the UI through Traefik (30-routes.yaml).
  selector:
    app: dispatcharr
  ports:
    - name: web
      port: 9191
      targetPort: 9191
