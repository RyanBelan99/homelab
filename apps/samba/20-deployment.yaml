apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: nas
  labels:
    app: samba
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      # Bind directly to the host's eth0 (192.168.0.34) instead of the pod overlay network,
      # so Avahi/WSDD2/NetBIOS broadcasts can actually reach LAN clients and SMB traffic
      # skips the ServiceLB/DNAT path.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: samba
          image: ghcr.io/servercontainers/samba:latest@sha256:57859789bd3425e6e929269fa13b16251cc8b8f939e4362ed7100aaf41a17122
          envFrom:
            - secretRef:
                name: samba-config
          env:
            - name: TZ
              value: America/Los_Angeles
          ports:
            - name: smb
              containerPort: 445
              protocol: TCP
          volumeMounts:
            - name: nas-data
              mountPath: /shares/nas
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
      volumes:
        - name: nas-data
          hostPath:
            path: /home/rbelan/shared/nas
            type: Directory
