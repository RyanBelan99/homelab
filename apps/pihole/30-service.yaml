apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: pihole
spec:
  type: LoadBalancer
  # Preserve real client IPs (LAN/VPN) instead of NAT-ing everything to 10.42.0.1
  externalTrafficPolicy: Local
  selector:
    app: pihole
  # DNS only. Ports 80/443 on the node belong to Traefik; the admin UI is
  # reached through it at http://pihole.home.arpa/admin/ (pihole-web below).
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
---
# In-cluster only: the admin UI behind Traefik (40-ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: pihole
spec:
  selector:
    app: pihole
  ports:
    - name: http
      port: 80
      targetPort: http
