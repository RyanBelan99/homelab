# Copy to secrets/secrets.yaml (gitignored) and fill in. Passed to Helm with -f.
secrets:
  # Admin console > DNS, e.g. tail1234.ts.net
  tailnet: CHANGE_ME

  piholePassword: CHANGE_ME
  sambaPassword: CHANGE_ME

  # One ProtonVPN WireGuard config per tunnel; tunnels sharing a key drop each other.
  vpn:
    qbittorrent:
      VPN_SERVICE_PROVIDER: protonvpn
      WIREGUARD_PRIVATE_KEY: CHANGE_ME
      WIREGUARD_ADDRESSES: 10.2.0.2/32
      SERVER_COUNTRIES: United States
      VPN_PORT_FORWARDING: "on"
      PORT_FORWARD_ONLY: "on"
    prowlarr:
      VPN_SERVICE_PROVIDER: protonvpn
      WIREGUARD_PRIVATE_KEY: CHANGE_ME
      WIREGUARD_ADDRESSES: 10.2.0.2/32
      SERVER_COUNTRIES: United States
    protonExit:
      VPN_SERVICE_PROVIDER: protonvpn
      WIREGUARD_PRIVATE_KEY: CHANGE_ME
      WIREGUARD_ADDRESSES: 10.2.0.2/32
      SERVER_COUNTRIES: United States

  tailscale:
    # One-off auth key, tag:exit-proton, pre-approved. Used only on first login.
    protonExitAuthKey: tskey-auth-CHANGE_ME
    # OAuth client, tag:k8s-operator, write on Services, Devices Core, Auth Keys.
    operatorClientId: CHANGE_ME
    operatorClientSecret: CHANGE_ME

  dispatcharr:
    dbPassword: CHANGE_ME
    apiKey: CHANGE_ME

  # Homepage widget API keys.
  homepage:
    RADARR_KEY: CHANGE_ME
    SONARR_KEY: CHANGE_ME
    PROWLARR_KEY: CHANGE_ME
    JELLYFIN_KEY: CHANGE_ME
    PIHOLE_KEY: CHANGE_ME
